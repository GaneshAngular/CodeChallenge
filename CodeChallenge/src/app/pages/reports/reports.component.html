<div class="container px-5">
  <!-- Page Header -->
  <h1 class="text-3xl font-bold mb-6">Report Dashboard</h1>

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
      <div class="bg-inherit p-6 rounded-lg shadow-lg shadow-gray-500">
          <h2 class="text-xl font-semibold">Interviews</h2>
          <p class="text-2xl font-bold">{{interviews?.length}}</p>
      </div>
      <div class="bg-inherit p-6 rounded-lg shadow-lg shadow-gray-500">
          <h2 class="text-xl font-semibold">Challenge Sessions</h2>
          <p class="text-2xl font-bold">{{sessions}}</p>
      </div>
      <div class="bg-inherit p-6 rounded-lg shadow-lg shadow-gray-500">
          <h2 class="text-xl font-semibold">Projects</h2>
          <p class="text-2xl font-bold">{{projects}}</p>
      </div>
  </div>

  <!-- Reports Table -->
  <div class="max-w-6xl mx-auto p-6 bg-inherit shadow-md rounded-lg mt-10">
    <div class="flex justify-between items-center mb-6">
      <div>
        <input
          type="text"
          [(ngModel)]="searchText"
          class="p-2 border border-gray-300 rounded"
          placeholder="Search Interviews"
          (keyup)="loadInterviews()"
        />
      </div>
      <!-- <button
        (click)="sortInterviews()"
        class="bg-blue-500 text-white py-2 px-4 rounded-lg"
      >
        Sort Interviews
      </button> -->
    </div>

    <div class="bg-inherit  p-4 mb-4 rounded-lg shadow-gray-500 shadow-md" *ngIf="totalpages===0" >
         <h2 >No Interviews FOund</h2>
    </div>
    <div *ngFor="let interview of interviews">
      <div class="bg-inherit  p-4 mb-4 rounded-lg shadow-gray-500 shadow-md">
        <h3 class="text-xl font-semibold interview-title">{{ interview.candidateName }}</h3>
        <ul class="mt-4 space-y-2">
          <li *ngFor="let challenge of interview.sessions" class="p-2 bg-inherit rounded-lg shadow-sm flex gap-10">
              <p>{{ challenge.title }}</p>
              <p class="text-gray-400">Status: {{ challenge.status }}</p>

              <p class="text-gray-400"  *ngIf="challenge.timetaken">Time: {{ challenge.timetaken |time }} MIN</p>
            <a [href]="trackSessionUrl+'/'+challenge?._id" target="_blank" rel="noopener noreferrer" class="text-blue-500 underline" >Track Session</a>
          </li>
        </ul>
      </div>
    </div>
    <div>
      <app-pagination [page]="page" [totalPages]="totalpages" (sendPage)="pageChange($event)"></app-pagination>
    </div>
  </div>
