<div>
  <app-nav-bar></app-nav-bar>
</div>
<div class="flex items-center text-inherit justify-center min-h-screen bg-inherit">
  <div class="w-full max-w-md bg-inherit text-inherit p-8 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-center text-blue-600">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-6">
      <div>
        <label class="block text-inherit">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 mt-2 border rounded-lg text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Enter your email">
        <p *ngIf="loginForm.controls.email.invalid && loginForm.controls.email.touched" class="text-red-500 text-sm">
          Enter a valid email.
        </p>
      </div>

      <div class="mt-4">
        <label class="block text-inherit">Password</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 mt-2 border rounded-lg text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Enter your password">
        <p *ngIf="loginForm.controls.password.invalid && loginForm.controls.password.touched" class="text-red-500 text-sm">
          Password must be at least 6 characters.
        </p>
      </div>

      <button
        type="submit"
        class="w-full mt-6 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition"
        [disabled]="loginForm.invalid">
        Login
      </button>
    </form>

    <p class="mt-4 text-center text-gray-600">
      Don't have an account?
      <a routerLink="/signup" class="text-blue-500 hover:underline">Sign up</a>
    </p>
  </div>
</div>
