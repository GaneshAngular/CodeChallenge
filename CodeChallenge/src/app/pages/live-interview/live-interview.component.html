<div class="relative w-full h-full flex flex-col ">
  <div>
    <img id="img" class="w-50 h-40" [src]="stream" alt="">
    <video width="300" height="300" class="bg-blue-50" src="" autoplay #video></video>
  </div>
  <div class="ms-auto m-1">
    <button (click)="endSession()" type="button" class="bg-red-500 p-2 rounded ">END SESSION</button>

  </div>
  <div class="mx-auto mt-10 text-center">
        <h1 class="text-2xl">Candidate Name: {{interview?.candidateName | uppercase}}</h1>

  </div>

  <div class="min-md:p-20">
    <div class="max-md:gap-0 justify-between mb-10 flex gap-20">
      <h2 class="text-xl uppercase">Challenge Sessions</h2>
      <button type="button" (click)="toggleModal()" class=" bg-green-300 px-2 py-1 rounded-xl w-1/3  ">+ Add </button>
    </div>
      <div class="grid grid-cols-3 max-md:grid-cols-1 gap-3">
        @for(session of interview?.sessions;track $index) {
          <div class="shadow-sm inset-shadow-sm shadow-gray-500 p-5 flex flex-col gap-y-3 overflow-hidden">
            <div class="text-lg">
              {{session.title}}
            </div>
            <div class="text-sm text-gray-500 !text-wrap w-full">
              <div><button type="button" (click)="copyLink(codechallengeUrl+'/'+session?._id)"  class="w-15 h-6 cursor-pointer bg-blue-300">Copy link</button></div>

            </div>
            @if (session?.status=='completed') {

              <div>
                <span for="time" class="text-lg">Time Taken:{{session?.timetaken |time}} MIN</span>

              </div>
            }
            <div>
              <label for="score" class="text-lg">Score:</label>
              <select name="score" class="p-1 border border-gray-400 rounded-md outline-none" id="score" (change)="updatedScore($event,session?._id)">
                @for (score of challengeScore; track $index) {
                  <option value="{{score}}" [selected]="score==session?.score">{{score}}</option>
                }
              </select>
            </div>
            <div><label for="status">Status:</label>
              <select name="status" id="status" class="border border-gray-500 p-1 rounded" (change)="updateChallengeSession($event,session?._id)">
                 @for (item of challengeStatus; track $index) {
                  @if(session?.status==item){
                    <option selected value="{{item}}">{{item}}</option>
                  }@else {
                    <option value="{{item}}">{{item}}</option>
                  }
                 }
              </select>
            </div>
            <!-- <div>
              {{session?.status=='inactive'?"Not Started":session?.status}}
            </div> -->
            <!-- <div>
              <button type="button" (click)="(session)" class="p-1 w-full cursor-pointer bg-green-400 rounded-md ">Submit</button>
            </div> -->
          </div>
        }
      </div>
  </div>


  <div id="crud-modal" *ngIf="sessionModel"  class="center overflow-y-auto overflow-x-hidden   z-50  w-full md:inset-0 ">
    <div class="relative p-4 w-full max-w-md max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                    Create New Challenge Session
                </h3>
                <button type="button" (click)="toggleModal()" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="crud-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <form [formGroup]="sessionForm" class="p-4 md:p-5">
                <div class="grid gap-4 mb-4 ">
                    <div class="col-span-2">
                        <label for="title" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Title</label>
                        <input type="text" name="title" formControlName="title" id="title" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Type product name" required="">
                    </div>

                    <div class="col-span-2 ">
                        <label for="project" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Select Project</label>
                        <select formControlName="project" id="project" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">

                         @for (project of projects; track $index) {
                           <option [value]="project?._id">{{project?.title}}</option>

                         }

                        </select>
                    </div>

                </div>
                <button (click)="createSession()" type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                    <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
                  Create Session
                </button>
            </form>
        </div>
    </div>
</div>
</div>
