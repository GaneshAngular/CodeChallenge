<div class="w-10/12 mx-auto relative h-full flex flex-col   ">
  <div >
   <h1 class="text-2xl uppercase">Projects</h1>
  </div>
 <div class="flex w-2/6 justify-between items-center my-7">
   <div>
     <input type="text" class="outline-none border border-gray-400 rounded-md " placeholder="search">
   </div>
   <div>
     <button class="w-20 h-10 rounded-full bg-blue-400" (click)="toggleModal()">Create</button>
   </div>
 </div>

 <div class="relative overflow-x-auto shadow-md sm:rounded-lg ">
   <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
       <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
           <tr>
               <th scope="col" class="px-6 py-3">
                   Project Title
               </th>
               <th scope="col" class="px-6 py-3">
                   Skills
               </th>
               <th scope="col" class="px-6 py-3">
                   Url
               </th>

               <th scope="col" class="px-6 py-3">
                   Action
               </th>
           </tr>
       </thead>
       <tbody>
        @for (project of projects; track $index;) {
           <tr class="odd:bg-white odd:dark:bg-gray-900 even:bg-gray-50 even:dark:bg-gray-800 border-b dark:border-gray-700 border-gray-200">
               <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                   {{project?.title}}
               </th>
               <td class="px-6 py-4">
                   {{project?.skills.join(' ,')}}
               </td>
               <td class="px-6 py-4">
                 <a [href]="project?.url" class="text-blue-500" target="_blank">{{project?.url}}</a>
               </td>

               <td class="px-6 py-4 flex gap-2">
                   <span (click)="editProject($index)"  class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Edit</span>
                   <span (click)="deleteProject(project?._id)"  class="font-medium text-red-600  hover:underline">Delete</span>
               </td>
           </tr>
          }@empty {
             <tr>
                 <td class="px-6 py-4 text-center text-gray-500 dark:text-gray-400" colspan="5">
                     No projects found.
                 </td>
             </tr>

          }
       </tbody>
   </table>
 </div>





 <!-- Main modal -->
 <div id="crud-modal" *ngIf="projectModal"  class="absolute overflow-y-auto overflow-x-hidden content-center  z-50 justify-center items-center w-full md:inset-0  max-h-full">
     <div class="relative p-4 w-full max-w-md max-h-full">
         <!-- Modal content -->
         <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
             <!-- Modal header -->
             <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
                 <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                     {{isProjectUpdate?"Update":"Create New"}} Project
                 </h3>
                 <button type="button" (click)="toggleModal()" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="crud-modal">
                     <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                         <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                     </svg>
                     <span class="sr-only">Close modal</span>
                 </button>
             </div>
             <!-- Modal body -->
             <form [formGroup]="projectForm" class="p-4 md:p-5">
                 <div class="grid gap-4 mb-4">
                     <div class="col-span-2">
                         <label for="title" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Title</label>
                         <input type="text" name="name" formControlName="title" id="title" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="title " required="">
                     </div>
                     <div class="col-span-2">
                         <label for="skills" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">skills</label>
                         <input type="text" name="skills" formControlName="skills" id="skills" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="skills" required="">
                     </div>

                     <div class="col-span-2">
                         <label for="url" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">StackBlitz Url</label>
                         <textarea id="url" rows="2" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"  formControlName="url" placeholder="stackBlitz Link..."></textarea>
                     </div>
                 </div>
                 <button type="button" (click)="isProjectUpdate?updateProject(project?._id):createProject()" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                     <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
                     {{isProjectUpdate?"Update":"Create New"}} Project
                 </button>
             </form>
         </div>
     </div>
 </div>

 </div>
