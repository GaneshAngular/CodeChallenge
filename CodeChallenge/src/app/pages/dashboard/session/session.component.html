<div class="container mx-auto ">
  <!-- Page Header -->
  <h1 class="text-3xl font-bold mb-6 text-center">Challenge Sessions</h1>

  <!-- Search and Create Button -->
  <div class="flex flex-col sm:flex-row sm:justify-center items-center my-7 gap-4">
      <input type="text" class="outline-none border border-gray-400 rounded-md p-2 text-black w-full sm:w-1/3" placeholder="Search title">
      <button class="w-32 h-10 rounded-full bg-blue-400" (click)="toggleModal()">Create</button>
  </div>

  <!-- Cards Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 justify-center px-5 ">
      @for (session of sessions; track $index) {
      <div class="bg-gray-800 p-6 rounded-lg shadow-lg flex flex-col justify-between ">
          <div>
              <h2 class="text-xl font-semibold">{{session?.title}}</h2>
              <p class="text-gray-400">Project: <span class="font-medium text-white">{{session?.project.title}}</span></p>
              <p class="text-gray-400">Status: <span class="font-medium" [ngClass]="{'text-green-400': session?.status === 'Completed', 'text-yellow-400': session?.status === 'Pending', 'text-red-400': session?.status === 'Delayed'}">{{session?.status}}</span></p>
          </div>
          <div class="mt-4 flex gap-x-3 justify-center">
              <span (click)="editSession($index)" class="font-medium cursor-pointer text-blue-600 hover:underline">Edit</span>
              <span (click)="deleteSession(session?._id)" class="font-medium cursor-pointer text-red-600 hover:underline">Delete</span>
          </div>
      </div>
      }
  </div>

  <!-- Main Modal -->
  <div id="crud-modal" *ngIf="sessionModel" class="fixed inset-0 flex justify-center items-center bg-black bg-opacity-50 z-50">
      <div class="relative p-4 w-full max-w-md max-h-full">
          <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700 p-6">
              <div class="flex items-center justify-between p-4 border-b rounded-t dark:border-gray-600 border-gray-200">
                  <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                      {{isUpdateSession ? "Update" : "Create New"}} Challenge Session
                  </h3>
                  <button type="button" (click)="toggleModal()" class="text-gray-400 hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 dark:hover:bg-gray-600 dark:hover:text-white">
                      <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                      </svg>
                  </button>
              </div>
              <form [formGroup]="sessionForm" class="p-4">
                  <div class="grid gap-4 mb-4">
                      <div>
                          <label for="title" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Title</label>
                          <input type="text" formControlName="title" id="title" class="bg-gray-50 border text-gray-900 text-sm rounded-lg p-2.5 w-full dark:bg-gray-600 dark:border-gray-500 dark:text-white" placeholder="Enter title">
                      </div>
                      <div>
                          <label for="project" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Select Project</label>
                          <select formControlName="project" id="project" class="bg-gray-50 border text-gray-900 text-sm rounded-lg p-2.5 w-full dark:bg-gray-600 dark:border-gray-500 dark:text-white">
                              <option>Select category</option>
                              @for (project of projects; track $index) {
                              <option [value]="project?._id">{{project?.title}}</option>
                              }
                          </select>
                      </div>
                  </div>
                  <button (click)="isUpdateSession ? updateSession(session?._id) : createSession()" type="submit" class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2.5">
                      <svg class="w-5 h-5 inline mr-1" fill="currentColor" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path>
                      </svg>
                      {{isUpdateSession ? "Update" : "Create"}} Session
                  </button>
              </form>
          </div>
      </div>
  </div>

  <div class="my-4 mx-auto">
      <app-pagination [page]="page" [totalPages]="totalPages" (sendPage)="changePage($event)"></app-pagination>
  </div>
</div>
