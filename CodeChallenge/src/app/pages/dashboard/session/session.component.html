<div class="w-10/12 mx-auto relative h-full flex flex-col   ">
  <div >
   <h1 class="text-2xl uppercase">Challenge Sessions</h1>
  </div>
 <div class="flex w-2/6 justify-between items-center my-7">
   <div>
     <input type="text" class="outline-none border border-gray-400 rounded-md " placeholder="search">
   </div>
   <div>
     <button class="w-20 h-10 rounded-full bg-blue-400" (click)="toggleModal()">Create</button>
   </div>
 </div>

 <div class="relative overflow-x-auto shadow-md sm:rounded-lg ">
   <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
       <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
           <tr>
               <th scope="col" class="px-6 py-3">
                   Title
               </th>
               <th scope="col" class="px-6 py-3">
                   Project
               </th>
               <th scope="col" class="px-6 py-3">
                   Status
               </th>

               <th scope="col" class="px-6 py-3">
                   Action
               </th>
           </tr>
       </thead>
       <tbody>
        @for (session of sessions; track $index) {
           <tr class="odd:bg-white odd:dark:bg-gray-900 even:bg-gray-50 even:dark:bg-gray-800 border-b dark:border-gray-700 border-gray-200">
               <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                  {{session?.title}}
               </th>
               <td class="px-6 py-4">
                   {{session?.project.title}}
               </td>
               <td class="px-6 py-4">
                   {{session?.status}}
               </td>

               <td class="px-6 py-4 flex gap-x-3" >
                <span (click)="editSession($index)"  class="font-medium cursor-pointer text-blue-600 dark:text-blue-500 hover:underline">Edit</span>
                   <span (click)="deleteSession(session?._id)"  class="font-medium cursor-pointer text-red-600   hover:underline">delete</span>
               </td>
           </tr>
          }

       </tbody>
   </table>
 </div>





 <!-- Main modal -->
 <div id="crud-modal" *ngIf="sessionModel"  class="absolute overflow-y-auto overflow-x-hidden content-center  z-50 justify-center items-center w-full md:inset-0  max-h-full">
     <div class="relative p-4 w-full max-w-md max-h-full">
         <!-- Modal content -->
         <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
             <!-- Modal header -->
             <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
                 <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                     {{isUpdateSession?"Update":"Create New"}} Challenge Session
                 </h3>
                 <button type="button" (click)="toggleModal()" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="crud-modal">
                     <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                         <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                     </svg>
                     <span class="sr-only">Close modal</span>
                 </button>
             </div>
             <!-- Modal body -->
             <form [formGroup]="sessionForm" class="p-4 md:p-5">
                 <div class="grid gap-4 mb-4 ">
                     <div class="col-span-2">
                         <label for="title" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Title</label>
                         <input type="text" name="title" formControlName="title" id="title" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Type product name" required="">
                     </div>

                     <div class="col-span-2 ">
                         <label for="project" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Select Project</label>
                         <select formControlName="project" id="project" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                          <option >Select category</option>
                          @for (project of projects; track $index) {
                            <option [value]="project?._id">{{project?.title}}</option>

                          }

                         </select>
                     </div>

                 </div>
                 <button (click)="isUpdateSession?updateSession(session?._id):createSession()" type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                     <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
                     Create Session
                 </button>
             </form>
         </div>
     </div>
 </div>

 </div>
