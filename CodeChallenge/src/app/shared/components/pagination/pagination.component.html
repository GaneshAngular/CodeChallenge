<div
  class="rouded-md w-full boder border border-none flex gap-2 items-center"
  *ngIf="pages?.length"
>
  <li
    class="rounded-full border border-gray-400 cursor-pointer list-none p-2 w-10 h-10 text-center hover:bg-blue-500 hover:text-white"
    (click)="previousPage()"
  >
    <
  </li>

  <li
    class="rounded-full border border-gray-400 cursor-pointer list-none p-2 w-10 h-10 text-center hover:bg-blue-500 hover:text-white"
    [ngClass]="{ 'bg-blue-500 text-white': item == currantPage }"
    (click)="viewPage(item)"
    *ngFor="let item of pages"
  >
    {{ item }}
  </li>
  <li
    class="rounded-full border border-gray-400 list-none p-2 w-10 h-10 text-center hover:bg-blue-500 hover:text-white"
    (click)="nextPage()"
  >
    >
  </li>

  <p >Total Page:{{totalPages}}</p>
</div>
